  <rect x="132" y="52" width="136" height="134" rx="10" fill="#FFFFFF"/>
  <path d="M200 56 V182 M136 118 H264" stroke="#E6DAF2" stroke-width="5"/>
  <circle cx="232" cy="88" r="14" fill="#E6DAF2"/>
  <!-- rod -->
  <rect x="92" y="40" width="216" height="8" rx="4" fill="#7E5AA8"/>
  <circle cx="92" cy="44" r="7" fill="#7E5AA8"/>
  <circle cx="308" cy="44" r="7" fill="#7E5AA8"/>
