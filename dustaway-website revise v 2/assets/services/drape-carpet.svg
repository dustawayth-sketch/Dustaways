  <circle cx="346" cy="184" r="5" fill="#B79CDB" opacity=".7"/>
  <circle cx="360" cy="170" r="4" fill="#B79CDB" opacity=".45"/>
  <!-- sparkles -->
  <path transform="translate(60 120)" d="M0 -13 C3 -3 3 -3 13 0 C3 3 3 3 0 13 C-3 3 -3 3 -13 0 C-3 -3 -3 -3 0 -13Z" fill="#B79CDB"/>
  <path transform="translate(345 90)" d="M0 -9 C2 -2 2 -2 9 0 C2 2 2 2 0 9 C-2 2 -2 2 -9 0 C-2 -2 -2 -2 0 -9Z" fill="#B79CDB"/>
