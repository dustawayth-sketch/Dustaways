  <rect x="96" y="222" width="208" height="36" rx="10" fill="#D9C8EE"/>
  <rect x="108" y="230" width="184" height="20" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M96 228 H84 M96 236 H84 M96 244 H84 M96 252 H84 M304 228 H316 M304 236 H316 M304 244 H316 M304 252 H316" stroke="#B79CDB" stroke-width="3" stroke-linecap="round"/>
