  <path d="M100 48 H162 C152 96 168 146 154 204 H106 C118 150 94 100 100 48Z" fill="#B79CDB"/>
  <path d="M120 54 C116 100 128 150 122 200 M142 54 C136 100 150 150 140 200" stroke="#9C7CC9" stroke-width="3" fill="none" stroke-linecap="round"/>
